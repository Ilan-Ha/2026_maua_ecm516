apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecm516-20262-classificacao-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecm516-20262-classificacao
  template:
    metadata:
      labels:
        app: ecm516-20262-classificacao
    spec:
      containers:
        - name: ecm516-20262-classificacao
          image: il4h/ecm516-20262-classificacao:1.0.0
          resources:
            limits:
              memory: 256Mi
              cpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: ecm516-20262-classificacao-clusterip-service
spec:
  type: ClusterIP
  selector:
    app: ecm516-20262-classificacao
  ports:  
    - name: ecm516-20262-classificacao
      protocol: TCP
      port: 7001
      targetPort: 7001