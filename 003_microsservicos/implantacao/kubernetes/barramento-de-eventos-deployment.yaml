apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecm516-20262-barramento-de-eventos-deployment
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: ecm516-20262-barramento-de-eventos
  template:
    metadata:
      labels:
        app: ecm516-20262-barramento-de-eventos
    spec:
      containers:
        - name: ecm516-20262-barramento-de-eventos
          image: rodbossini/ecm516-20262-barramento-de-eventos
          resources:
            limits:
              memory: 256Mi
              cpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: ecm516-20262-barramento-de-eventos-service
spec:
  type: ClusterIP
  selector:
    app: ecm516-20262-barramento-de-eventos
  ports:
    - name: ecm516-20262-barramento-de-eventos
      protocol: TCP
      port: 10000
      targetPort: 10000 