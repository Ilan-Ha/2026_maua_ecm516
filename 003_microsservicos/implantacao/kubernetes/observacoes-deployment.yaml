apiVersion: apps/v1
kind: Deployment
metadata: 
  name: ecm516-20262-observacoes-deployment
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: ecm516-20262-observacoes
  template:
    metadata:
      labels:
        app: ecm516-20262-observacoes
    spec:
      containers:
        - name: ecm516-20262-observacoes
          image: il4h/ecm516-20262-observacoes:1.0.0
          resources:
            limits:
              memory: 256Mi
              cpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: ecm516-20262-observacoes-service
spec:
  type: NodePort
  selector: 
    app: ecm516-20262-observacoes
  ports:
    - name: ecm516-20262-observacoes
      protocol: TCP
      port: 5001
      targetPort: 5001
---
apiVersion: v1
kind: Service
metadata: 
  name: ecm516-20262-observacoes-clusterip-service
spec:
  type: ClusterIP
  selector:
    app: ecm516-20262-observacoes
  ports:
    - name: ecm516-20262-observacoes
      protocol: TCP
      port: 5001
      targetPort: 5001