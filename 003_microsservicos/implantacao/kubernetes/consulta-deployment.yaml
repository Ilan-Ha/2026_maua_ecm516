apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecm516-20262-consulta-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecm516-20262-consulta
  template:
    metadata:
      labels:
        app: ecm516-20262-consulta
    spec:
      containers:
        - name: ecm516-20262-consulta
          image: il4h/ecm516-20262-consulta:1.0.0
          resources:
            limits:
              memory: 256Mi
              cpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: ecm516-20262-consulta-service
spec:
  type: NodePort
  selector:
    app: ecm516-20262-consulta
  ports:
    - name: ecm516-20262-consulta
      protocol: TCP
      port: 6000
      targetPort: 6000
---
apiVersion: v1
kind: Service
metadata: 
  name: ecm516-20262-consulta-clusterip-service
spec:
  type: ClusterIP
  selector: 
    app: ecm516-20262-consulta
  ports: 
    - name: ecm516-20262-consulta
      protocol: TCP
      port: 6000
      targetPort: 6000