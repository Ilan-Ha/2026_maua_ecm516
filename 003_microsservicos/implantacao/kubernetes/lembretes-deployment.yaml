apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecm516-20262-lembretes-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecm516-2026-lembretes
  template:
    metadata:
      labels:
        app: ecm516-2026-lembretes
    spec:
      containers:
        - name: ecm516-20262-lembretes
          image: il4h/ecm516-20262-lembretes:1.0.0
          resources:
            limits:
              memory: 256Mi
              cpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: ecm516-20262-lembretes-clusterip-service
spec:
  type: ClusterIP
  selector:
    app: ecm516-2026-lembretes
  ports:
    - name: ecm516-2026-lembretes
      protocol: TCP
      port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: Service
metadata: 
  name: ecm516-20262-lembretes-service
spec:
  type: NodePort
  selector:
    app: ecm516-2026-lembretes
  ports:
    - name: ecm516-2026-lembretes
      protocol: TCP
      port: 4000
      targetPort: 4000
