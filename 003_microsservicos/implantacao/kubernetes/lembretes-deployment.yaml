apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecm516-20262-lembretes-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lembretes
  template:
    metadata:
      labels:
        app: lembretes
    spec:
      containers:
        - name: ecm516-20262-lembretes
          image: rodbossini/lembretes
          resources:
            limits:
              memory: 256Mi
              cpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: ecm516-20262-lembretes-clusterip-service
spec:
  type: ClusterIP
  selector:
    app: lembretes
  ports:
    - name: lembretes
      protocol: TCP
      port: 4000
      targetPort: 4000
